
name: Extract PlayZippy source and build

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        run: |
          if [ -f playzippy_files.zip ]; then
            unzip -o playzippy_files.zip -d .
          else
            unzip -o PlayZippy_GitHub_Upload.zip -d .
          fi
          test -f package.json
          test -d src
          test -d public

      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract PlayZippy source project"
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build website
        run: npm run build

      - name: Commit dependency lockfile
        if: success()
        run: |
          if [ -f package-lock.json ] && [ -n "$(git status --porcelain package-lock.json)" ]; then
            git add package-lock.json
            git commit -m "Add npm dependency lockfile"
            git push
          fi
